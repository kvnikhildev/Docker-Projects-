services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ORIGIN: http://localhost:5173
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d emp_list"]
      interval: 5s
      timeout: 3s
      retries: 10 
volumes:
  postgres_data:

      