services:
  db:
    image: postgres:17
    container_name: postgress-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 
      - ./databse.init:/docker-entrypoint-initdb.d
volumes:
  postgres_data:

