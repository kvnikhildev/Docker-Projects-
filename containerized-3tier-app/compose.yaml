services: 
  frontend:
    build: ./frontend
    ports:
      - "8000:80"
    volumes:  
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro  
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: emp_list
      DB_USER: admin
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: emp_list
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d emp_list"]
      interval: 5s
      timeout: 3s
      retries: 10
    
volumes:
  postgres_data:
